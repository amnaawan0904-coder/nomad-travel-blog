name: Daily articles

on:
  schedule:
    # Main run: 05:00 UTC = 10:00 Pakistan Standard Time. Creates and PUBLISHES 2 new travel articles.
    - cron: "0 5 * * *"
    # Backup run: 08:00 UTC = 13:00 PKT. GitHub can delay or drop scheduled runs when busy; this run only
    # creates whatever is still missing for the day (usually nothing), so the site never gets more than 2 a day.
    - cron: "0 8 * * *"
  # Manual: Actions tab → "Daily articles" → "Run workflow" (optional — not needed for daily publishing).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: generate and show the article(s), but don't save them"
        type: boolean
        default: true
      publish:
        description: "Publish immediately (otherwise saved as drafts). Ignored in a dry run."
        type: boolean
        default: false
      articles:
        description: "How many articles to create"
        type: choice
        options: ["1", "2"]
        default: "1"

# Never run two generations at the same time.
concurrency:
  group: daily-articles
  cancel-in-progress: false

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  generate:
    name: Generate travel articles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets are passed only as environment variables. GitHub masks their values in logs,
      # and the scripts never print them.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional repository variable (not a secret) to switch Gemini models without editing code.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      # Scheduled runs: exactly 2 published articles per UTC day (set variable AUTO_PUBLISH=false for drafts).
      DAILY_TARGET: ${{ github.event_name == 'schedule' && '2' || '' }}
      # Manual runs: follow the checkboxes.
      ARTICLES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.articles || '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      PUBLISH: ${{ ((github.event_name == 'schedule' && vars.AUTO_PUBLISH != 'false') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
    steps:
      - name: Check required secrets are set
        # Reports only whether each secret exists — never its value.
        run: |
          missing=0
          for name in GEMINI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            else
              echo "✓ $name is set"
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Publishes any articles you marked 'scheduled' in Supabase whose published_at time has passed.
      - name: Publish scheduled articles
        run: node scripts/publish-scheduled.mjs

      - name: Generate travel articles
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            echo "Dry run: article(s) will be shown below and on the run summary page, but NOT saved."
          elif [ "$PUBLISH" = "1" ]; then
            echo "Live run: article(s) will be PUBLISHED to the website."
          else
            echo "Live run: article(s) will be saved to Supabase as DRAFTS."
          fi
          node scripts/generate-article.mjs
