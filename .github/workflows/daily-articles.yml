name: Daily articles

on:
  # Automatic: every day at 06:00 UTC (11:00 in Pakistan). GitHub may start a few minutes late.
  # Scheduled runs PUBLISH the article (set repository variable AUTO_PUBLISH=false to save drafts instead).
  schedule:
    - cron: "0 6 * * *"
  # Manual: Actions tab → "Daily articles" → "Run workflow".
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: generate and show the article, but don't save it to Supabase"
        type: boolean
        default: true
      publish:
        description: "Publish immediately (otherwise it's saved as a draft). Ignored in a dry run."
        type: boolean
        default: false

# Never run two generations at the same time.
concurrency:
  group: daily-articles
  cancel-in-progress: false

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  generate:
    name: Generate article
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets are passed only as environment variables. GitHub masks their values in logs,
      # and the scripts never print them.
      # AI: Gemini is used when GEMINI_API_KEY is set; otherwise Claude (ANTHROPIC_API_KEY).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional repository variable (not a secret) to switch Gemini models without editing code.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Manual runs: follow the checkboxes. Scheduled runs: never a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      PUBLISH: ${{ ((github.event_name == 'schedule' && vars.AUTO_PUBLISH != 'false') || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
    steps:
      - name: Check required secrets are set
        # Reports only whether each secret exists — never its value.
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            else
              echo "✓ $name is set"
            fi
          done
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✓ GEMINI_API_KEY is set — using Gemini"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✓ ANTHROPIC_API_KEY is set — using Claude"
          else
            echo "::error::Set a GEMINI_API_KEY (or ANTHROPIC_API_KEY) repository secret."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Publishes any articles you marked 'scheduled' in Supabase whose published_at time has passed.
      - name: Publish scheduled articles
        run: node scripts/publish-scheduled.mjs

      - name: Generate article
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            echo "Dry run: the article will be shown below and on the run summary page, but NOT saved."
          elif [ "$PUBLISH" = "1" ]; then
            echo "Live run: the article will be PUBLISHED and appear on the website."
          else
            echo "Live run: the article will be saved to Supabase as a DRAFT."
          fi
          node scripts/generate-article.mjs
